<svg viewBox="0 0 710 175" width="710" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f3d5e"/></marker></defs><rect x="10" y="20" width="190" height="116" rx="6" fill="#fff3d6" stroke="#0f3d5e" stroke-width="1.3"/><text x="105.0" y="37" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">Input</text><text x="105.0" y="51" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">notes text (40-20,000 chars)</text><text x="105.0" y="65" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">N questions (default 5)</text><text x="105.0" y="79" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">summary word limit (default 100)</text><text x="105.0" y="93" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">optional subject, difficulty</text><line x1="200" y1="78" x2="260" y2="78" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="260" y="40" width="180" height="76" rx="6" fill="#dbeafe" stroke="#0f3d5e" stroke-width="1.3"/><text x="350.0" y="57" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">SmartStudy pipeline</text><text x="350.0" y="71" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P1 &gt; P2 &gt; guard &gt; P3</text><text x="350.0" y="85" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">&gt; keep N &gt; count &gt; P4</text><line x1="440" y1="78" x2="500" y2="78" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="500" y="8" width="200" height="140" rx="6" fill="#fff3d6" stroke="#0f3d5e" stroke-width="1.3"/><text x="600.0" y="25" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">Output (JSON + UI + Markdown)</text><text x="600.0" y="39" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">summary (&lt;= limit)</text><text x="600.0" y="53" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">key terms + definition + quote</text><text x="600.0" y="67" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">questions: mcq / short / true-false</text><text x="600.0" y="81" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">answer + source quote each</text><text x="600.0" y="95" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">warnings, trace of dropped items</text><text x="10" y="165" font-size="10" font-family="Arial" fill="#4a5a6a">Missing information is reported as a warning, never invented.</text></svg>