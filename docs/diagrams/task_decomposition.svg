<svg viewBox="0 0 700 166" width="700" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f3d5e"/></marker></defs><rect x="180" y="6" width="340" height="30" rx="6" fill="#fff3d6" stroke="#0f3d5e" stroke-width="1.3"/><text x="350.0" y="23" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">Goal: a trustworthy study pack from lecture notes</text><line x1="350" y1="36" x2="88" y2="70" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="8" y="70" width="160" height="62" rx="6" fill="#dbeafe" stroke="#0f3d5e" stroke-width="1.3"/><text x="88.0" y="87" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">1 Understand</text><text x="88.0" y="101" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P1 outline of topics</text><text x="88.0" y="115" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">(coverage checklist)</text><line x1="350" y1="36" x2="260" y2="70" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="180" y="70" width="160" height="62" rx="6" fill="#dbeafe" stroke="#0f3d5e" stroke-width="1.3"/><text x="260.0" y="87" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">2 Write content</text><text x="260.0" y="101" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P2: summary, key terms,</text><text x="260.0" y="115" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">N+2 questions + quotes</text><line x1="350" y1="36" x2="432" y2="70" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="352" y="70" width="160" height="62" rx="6" fill="#e6f4ea" stroke="#0f3d5e" stroke-width="1.3"/><text x="432.0" y="87" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">3 Verify</text><text x="432.0" y="101" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Code: quote must exist</text><text x="432.0" y="115" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P3: answer from notes only</text><line x1="350" y1="36" x2="604" y2="70" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="524" y="70" width="160" height="62" rx="6" fill="#e6f4ea" stroke="#0f3d5e" stroke-width="1.3"/><text x="604.0" y="87" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430" font-weight="bold">4 Control format</text><text x="604.0" y="101" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Code: keep first N, warn</text><text x="604.0" y="115" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Code count + P4 shorten</text><text x="8" y="158" font-size="10" font-family="Arial" fill="#4a5a6a">Why split: exact checks (quotes, word counts) are cheaper and more reliable in code than in a prompt; judgement tasks stay in prompts.</text></svg>