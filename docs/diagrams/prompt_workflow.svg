<svg viewBox="0 0 660 426" width="660" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f3d5e"/></marker></defs><rect x="60" y="8" width="330" height="34" rx="6" fill="#fff3d6" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="25" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Input: Lecture notes + N questions + word limit</text><line x1="225" y1="42" x2="225" y2="58" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="58" width="330" height="34" rx="6" fill="#dbeafe" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="75" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P1 Outline: LLM: list the topics taught</text><line x1="225" y1="92" x2="225" y2="108" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="108" width="330" height="48" rx="6" fill="#dbeafe" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="125" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P2 Generate: LLM: summary, key terms, N+2 questions,</text><text x="225.0" y="139" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">each with a verbatim source quote</text><line x1="225" y1="156" x2="225" y2="172" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="172" width="330" height="34" rx="6" fill="#e6f4ea" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="189" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Quote guard: code: is the quote really in the notes?</text><line x1="225" y1="206" x2="225" y2="222" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="222" width="330" height="34" rx="6" fill="#dbeafe" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="239" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P3 Moderator: LLM: answer each question from notes only</text><line x1="225" y1="256" x2="225" y2="272" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="272" width="330" height="34" rx="6" fill="#e6f4ea" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="289" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Keep first N: code: never pad; warn if fewer</text><line x1="225" y1="306" x2="225" y2="322" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="322" width="330" height="34" rx="6" fill="#e6f4ea" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="339" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Word count: code: summary within the limit?</text><line x1="225" y1="356" x2="225" y2="372" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="372" width="330" height="34" rx="6" fill="#fff3d6" stroke="#0f3d5e" stroke-width="1.3"/><text x="225.0" y="389" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Study pack: summary, terms, questions, warnings</text><rect x="450" y="213" width="190" height="34" rx="6" fill="#fde8e8" stroke="#b3261e" stroke-width="1.3"/><text x="545.0" y="230" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">Dropped items are logged</text><text x="545.0" y="244" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">in the workflow trace</text><line x1="390" y1="178" x2="450" y2="225" stroke="#0f3d5e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="390" y1="262" x2="450" y2="238" stroke="#0f3d5e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="450" y="345" width="190" height="48" rx="6" fill="#dbeafe" stroke="#0f3d5e" stroke-width="1.3"/><text x="545.0" y="362" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">P4 Shorten (LLM)</text><text x="545.0" y="376" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">only if over the limit,</text><text x="545.0" y="390" text-anchor="middle" font-size="11" font-family="Arial" fill="#1b2430">then re-check once</text><line x1="390" y1="352" x2="450" y2="358" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><line x1="450" y1="382" x2="390" y2="378" stroke="#0f3d5e" stroke-width="1.4" marker-end="url(#a)"/><text x="395" y="346" font-size="9.5" font-family="Arial" fill="#4a5a6a">too long</text><text x="402" y="398" font-size="9.5" font-family="Arial" fill="#4a5a6a">retry</text><text x="430" y="30" font-size="10" font-family="Arial" fill="#4a5a6a">Blue = LLM, Green = code, Yellow = data</text></svg>